name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal dylib
        run: make

      - name: Show architectures
        run: lipo -info libcivdisplay.dylib

      - name: Self-test
        run: make test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcivdisplay-dylib
          path: libcivdisplay.dylib
          if-no-files-found: error

      - name: Attach dylib to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: libcivdisplay.dylib
          generate_release_notes: true
